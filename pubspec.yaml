name: ai_app
description: "A AI Chat Application for Language Learning with BLoC and Dio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Routing ---
  go_router: ^14.2.0

  # --- State Management ---
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5 
  get_it: ^7.7.0 
  injectable: ^2.4.2
  # --- Network & API ---
  dio: ^5.5.0+1
  web_socket_channel: ^3.0.1
  stream_transform: ^2.1.1
  # --- Security & Environment ---
  flutter_dotenv: ^5.1.0 

  # --- Local Database ---
  path: ^1.9.0
  path_provider: ^2.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Audio & Voice ---
  record: ^5.1.0
  audioplayers: ^6.0.0
  speech_to_text: ^7.0.0
  
  # --- Background & Overlay Features ---
  # home_widget: ^0.7.1
  # flutter_overlay_window: ^0.5.2
  permission_handler: ^12.0.3

  # --- UI & Animations ---
  loading_animation_widget: ^1.2.1
  flutter_markdown: ^0.7.2
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.5
  animated_text_kit: ^4.2.2
  flutter_expandable_fab: ^2.5.2
  
  collection: ^1.19.1
  
  dash_chat_2: ^0.0.21
    # --- AI and Tools ---
  chat_gpt_sdk: ^3.1.5
  dart_openai: ^6.1.1
  firebase_ai: ^3.13.1
  firebase_core: ^4.11.0
  firebase_core_platform_interface: ^7.1.0
  flutter_sound: ^9.30.0
  livekit_client: ^2.6.4
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  injectable_generator: ^2.6.2

# این بخش برای حل باگ نسخه های ناسازگار record در لینوکس/اندروید اضافه شد
dependency_overrides:
  record_platform_interface: 1.1.0
  record_android: 1.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/config.env
    - assets/images/logo.png 
    - assets/images/person1.png
    - assets/images/person2.png
    - assets/images/person3.png

  fonts:
    - family: Samim
      fonts:
        - asset: assets/fonts/Samim-WOL.ttf
        - asset: assets/fonts/Samim-Bold-WOL.ttf
          weight: 700

    - family: BYekan
      fonts:
        - asset: assets/fonts/BYekan+.ttf
          weight: 500
        - asset: "assets/fonts/BYekan+ Bold.ttf"
          weight: 700

    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
        
    - family: IranYekan
      fonts:
        - asset: "assets/fonts/Qs_Iranyekan thin.ttf"
          weight: 100
        - asset: "assets/fonts/Qs_Iranyekan light.ttf"
          weight: 300
        - asset: assets/fonts/Qs_Iranyekan.ttf
          weight: 400
        - asset: "assets/fonts/Qs_Iranyekan medium.ttf"
          weight: 500
        - asset: "assets/fonts/Qs_Iranyekan bold.ttf"
          weight: 700
        - asset: "assets/fonts/Qs_Iranyekan extrabold.ttf"
          weight: 800
        - asset: "assets/fonts/Qs_Iranyekan black.ttf"
          weight: 900
